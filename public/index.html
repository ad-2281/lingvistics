<!DOCTYPE html>
<html lang="ro" class="h-full bg-slate-50">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Platformă de Cursuri Lingvistice</title>

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">

  <!-- Tailwind CSS with Typography Plugin -->
  <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>

  <!-- Custom Styles for Ingested HTML Isolation -->
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="h-full antialiased font-sans text-slate-800 bg-slate-50 selection:bg-blue-600 selection:text-white">
  
  <!-- Main Application Mount Point -->
  <div id="app" class="min-h-full"></div>

  <!-- Entry Script (ES Module) -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
