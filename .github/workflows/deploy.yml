name: Deploy Platform & Sync Content

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_ingestion:
        description: 'Run HTML content ingestion to Supabase (requires input_content/ in repo)'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  backend_and_content_sync:
    name: Database Migrations & Optional Content Sync
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push Database Migrations
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -n "$SUPABASE_DB_URL" ]; then
            echo "Applying PostgreSQL migrations to Supabase..."
            supabase db push --db-url "$SUPABASE_DB_URL"
          else
            echo "SUPABASE_DB_URL secret not provided; skipping direct CLI migration push."
          fi

      - name: Determine Whether to Run Ingestion
        id: check_ingestion
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            if [ "${{ github.event.inputs.run_ingestion }}" = "true" ]; then
              echo "should_ingest=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_ingest=false" >> "$GITHUB_OUTPUT"
            fi
          else
            # On push to main: run automatically only if input_content/ exists in the repo and contains modules
            if [ -d "input_content" ] && [ -n "$(find input_content -name 'module_meta.json' -print -quit)" ]; then
              echo "should_ingest=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_ingest=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Python 3.11
        if: steps.check_ingestion.outputs.should_ingest == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        if: steps.check_ingestion.outputs.should_ingest == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Run HTML Ingestion Pipeline
        if: steps.check_ingestion.outputs.should_ingest == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/ingest_content.py --allow-missing

  deploy_frontend:
    name: Deploy Frontend to GitHub Pages
    needs: backend_and_content_sync
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Frontend Config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat <<EOF > public/js/config.js
          // Auto-generated during GitHub Actions deployment
          export const SUPABASE_URL = "${SUPABASE_URL}";
          export const SUPABASE_ANON_KEY = "${SUPABASE_ANON_KEY}";
          EOF
          echo "Generated public/js/config.js successfully."

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4